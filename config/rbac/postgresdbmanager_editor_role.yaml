# permissions for end users to edit postgresdbmanagers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-pg-manager-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgresdbmanager-editor-role
rules:
- apiGroups:
  - postgres.db.management.minikube.local
  resources:
  - postgresdbmanagers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgres.db.management.minikube.local
  resources:
  - postgresdbmanagers/status
  verbs:
  - get
